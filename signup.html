<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClassMate - Sign Up</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .bg-purple { background-color: #6f42c1; }
        .text-purple { color: #6f42c1; }
        .btn-purple { background-color: #6f42c1; color: #fff; }
        .btn-purple:hover { background-color: #59339d; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark bg-purple">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">ClassMate</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link active" href="{{ url_for('signup') }}">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h2 class="text-purple fw-bold">Join ClassMate</h2>
                <p class="text-secondary">Fill in the form below to create your account.</p>

                <!-- Problems found by validate_signup() in app.py -->
                {% if problems %}
                    <div class="alert alert-danger">
                        <ul class="mb-0">
                            {% for problem in problems %}<li>{{ problem }}</li>{% endfor %}
                        </ul>
                    </div>
                {% endif %}

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ username }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">At least 8 characters, including a number.</div>
                    </div>
                    <div class="mb-2">
                        <label for="confirm" class="form-label">Repeat Password</label>
                        <input type="password" class="form-control" id="confirm" name="confirm" required>
                    </div>
                    <button type="button" class="btn btn-link px-0 mb-3 text-purple" id="toggle"
                            onclick="togglePasswords()">Show passwords</button>
                    <button type="submit" class="btn btn-purple w-100">Create Account</button>
                </form>

                <p class="mt-3"><a href="{{ url_for('index') }}" class="text-purple">Return to homepage</a></p>
            </div>
        </div>
    </main>

    <footer class="border-top py-3 text-center text-secondary small">
        ClassMate &middot; CSC 312 Lab Project
    </footer>

    <script>
        // Switch both password boxes between hidden and visible
        function togglePasswords() {
            var fields = [document.getElementById("password"), document.getElementById("confirm")];
            var hidden = fields[0].type === "password";
            fields.forEach(function (f) { f.type = hidden ? "text" : "password"; });
            document.getElementById("toggle").textContent = hidden ? "Hide passwords" : "Show passwords";
        }
    </script>

</body>
</html>
